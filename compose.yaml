name: manga-translator

services:
  api:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: ./api
      target: gpu
    image: manga-translator-api:gpu
    gpus: all
    restart: unless-stopped
    init: true
    env_file:
      - ./api/.env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      API_DEBUG: "False"
      API_RELOAD: "False"
      API_CONTAINER: "True"
      GPU_PROVIDER: CUDAExecutionProvider
      HF_HOME: /home/translator/.cache/huggingface
    ports:
      - "${DOCKER_BIND_IP:-0.0.0.0}:${DOCKER_API_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ./api/app/models
        target: /app/app/models
        read_only: true
        bind:
          create_host_path: false
      - huggingface-cache:/home/translator/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  huggingface-cache:
